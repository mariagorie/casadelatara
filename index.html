<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gard la țară</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div id="header"></div>

    <h1>Casa de la țară</h1>
    Gardul de grădină

    <div id="stats" class="stats"></div>

    <div class="card">
      <h3>Progres general</h3>
      <div class="progress"><div class="progress-fill" id="progress-bar" style="width: 0%"></div></div>
      <p style="font-size: 0.85rem; color: var(--text-muted);" id="progress-text">—</p>
    </div>

    <h2>Etapele proiectului</h2>
    <div id="etape"></div>

    <h2>Ultimul jurnal</h2>
    <div id="ultim-jurnal"></div>

    <div id="footer"></div>
  </div>

  <script src="script.js"></script>
  <script>
    (async () => {
      document.getElementById('header').innerHTML = headerHTML('index');
      document.getElementById('footer').innerHTML = footerHTML();

      try {
        const data = await loadData();
        const stats = totalTaskuri(data.etape);
        const bugetTotal = totalDeviz(data.deviz);

        document.getElementById('stats').innerHTML = `
          <div class="stat">
            <div class="stat-label">Progres</div>
            <div class="stat-value">${stats.procent}<span class="unit">%</span></div>
          </div>
          <div class="stat">
            <div class="stat-label">Task-uri făcute</div>
            <div class="stat-value">${stats.facute}<span class="unit">/ ${stats.total}</span></div>
          </div>
          <div class="stat">
            <div class="stat-label">Buget estimat</div>
            <div class="stat-value">${formatLei(bugetTotal)}</div>
          </div>
          <div class="stat">
            <div class="stat-label">Lungime gard</div>
            <div class="stat-value">315<span class="unit">m</span></div>
          </div>
        `;

        document.getElementById('progress-bar').style.width = stats.procent + '%';
        document.getElementById('progress-text').textContent =
          `${stats.facute} din ${stats.total} task-uri bifate.`;

        document.getElementById('etape').innerHTML = data.etape.map(et => {
          const taskuriFacute = et.taskuri.filter(t => t.facut).length;
          const pct = et.taskuri.length ? Math.round(taskuriFacute / et.taskuri.length * 100) : 0;
          return `
            <div class="etapa">
              <div class="etapa-header">
                <div>
                  <div class="etapa-title">Etapa ${et.id} — ${et.nume}</div>
                  <div class="etapa-desc">${et.descriere}</div>
                </div>
                ${statusBadge(et.status)}
              </div>
              <div class="progress"><div class="progress-fill" style="width: ${pct}%"></div></div>
              <div class="etapa-meta">
                <span>${taskuriFacute} / ${et.taskuri.length} task-uri</span>
                <span>~${et.weekenduri_estimate} weekenduri</span>
              </div>
            </div>
          `;
        }).join('');

        if (data.jurnal.length) {
          const ultim = data.jurnal[data.jurnal.length - 1];
          document.getElementById('ultim-jurnal').innerHTML = `
            <div class="jurnal-entry">
              <div class="jurnal-date">${formatDate(ultim.data)}</div>
              <div class="jurnal-title">${ultim.titlu}</div>
              <div class="jurnal-text">${ultim.text}</div>
            </div>
          `;
        } else {
          document.getElementById('ultim-jurnal').innerHTML =
            '<div class="empty-state">Niciun jurnal încă. Adaugă unul în data.json.</div>';
        }
      } catch (err) {
        document.querySelector('.container').innerHTML += `
          <div class="info-banner">Nu am putut încărca datele: ${err.message}</div>
        `;
      }
    })();
  </script>
</body>
</html>
